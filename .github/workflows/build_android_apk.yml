name: Build DeskRemote BLE Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "mobile/**"
      - ".github/workflows/build_android_apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android Gradle files & preserve BLE AndroidManifest
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms=android --org com.deskremote --project-name desk_remote_ble .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies & analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/DeskRemote-BLE-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DeskRemote-BLE-APK
          path: mobile/build/app/outputs/flutter-apk/DeskRemote-BLE-release.apk
