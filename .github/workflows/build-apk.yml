name: Build DeskRemote BLE Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/upload-keystore.jks
            {
              echo "KEYSTORE_PATH=/tmp/upload-keystore.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release signing keystore configured."
          else
            echo "KEYSTORE_BASE64 not set; falling back to debug signing."
          fi

      - name: Install Flutter dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DeskRemote-BLE-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
